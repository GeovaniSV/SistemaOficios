  /api/backups/auto:
    post:
      summary: 'Backup automático'
      operationId: backupAutomtico
      description: "Gera um backup do banco de dados e armazena no Cloudflare R2 (bucket de backup).\nExecuta automaticamente a limpeza: remove backups automáticos com mais de 5 dias\ne garante que no máximo 5 backups automáticos permaneçam disponíveis.\n\nAutenticado via chave de API do broker (`X-Broker-Api-Key`), não por Sanctum.\nDeve ser chamado pelo cron do servidor.\n\n**Exemplo de chamada via cron:**\n```\ncurl -X POST https://seu-dominio.com/api/backups/auto \\\n  -H \"X-Broker-Api-Key: SUA_CHAVE_AQUI\"\n```"
      parameters:
        -
          in: header
          name: X-Broker-Api-Key
          description: ''
          example: '{BROKER_API_KEY} required'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Backup automático realizado com sucesso'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Backup automático realizado com sucesso'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthorized
                properties:
                  message:
                    type: string
                    example: Unauthorized
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Nenhum arquivo de backup foi gerado (exit code: 1)'
                properties:
                  message:
                    type: string
                    example: 'Nenhum arquivo de backup foi gerado (exit code: 1)'
      tags:
        - 'Broker (Interno)'
      security: []
