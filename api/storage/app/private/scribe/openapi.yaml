openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Autenticação
    description: ''
  -
    name: Usuários
    description: ''
  -
    name: Cargos
    description: ''
  -
    name: Papéis
    description: ''
  -
    name: Contatos
    description: ''
  -
    name: Ofícios
    description: ''
  -
    name: 'Templates de Ofício'
    description: ''
  -
    name: Mensagens
    description: ''
  -
    name: Configurações
    description: ''
  -
    name: SMTP
    description: ''
  -
    name: 'Validação de Documentos'
    description: ''
  -
    name: 'Logs de Workers'
    description: ''
  -
    name: Backups
    description: ''
  -
    name: 'Broker (Interno)'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtenha seu token via <b>POST /api/auth/login</b>.'
security:
  -
    default: []
paths:
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      description: 'Autentica o usuário e retorna um token Bearer Sanctum.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|AbCdEf...
                  user:
                    id: 1
                    name: 'Hugo Barbosa'
                    email: hugo@example.com
                    is_dev: false
                    position:
                      id: 1
                      name: Diretor
                    roles:
                      -
                        id: 1
                        name: admin
                properties:
                  token:
                    type: string
                    example: 1|AbCdEf...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Hugo Barbosa'
                      email:
                        type: string
                        example: hugo@example.com
                      is_dev:
                        type: boolean
                        example: false
                      position:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: Diretor
                      roles:
                        type: array
                        example:
                          -
                            id: 1
                            name: admin
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: admin
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Credenciais inválidas.'
                properties:
                  message:
                    type: string
                    example: 'Credenciais inválidas.'
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revoga o token de acesso atual.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logout realizado com sucesso.'
                properties:
                  message:
                    type: string
                    example: 'Logout realizado com sucesso.'
      tags:
        - Autenticação
  /api/auth/logout-all:
    post:
      summary: 'Logout de todos os dispositivos'
      operationId: logoutDeTodosOsDispositivos
      description: 'Revoga todos os tokens Sanctum do usuário autenticado.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Todos os tokens revogados.'
                properties:
                  message:
                    type: string
                    example: 'Todos os tokens revogados.'
      tags:
        - Autenticação
  /api/auth/me:
    get:
      summary: 'Usuário autenticado'
      operationId: usurioAutenticado
      description: 'Retorna os dados do usuário logado, incluindo cargo e papéis.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Hugo Barbosa'
                  email: hugo@example.com
                  is_active: true
                  is_dev: false
                  position:
                    id: 1
                    name: Diretor
                    is_active: true
                  roles:
                    -
                      id: 1
                      name: admin
                      status: Ativo
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Hugo Barbosa'
                  email:
                    type: string
                    example: hugo@example.com
                  is_active:
                    type: boolean
                    example: true
                  is_dev:
                    type: boolean
                    example: false
                  position:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Diretor
                      is_active:
                        type: boolean
                        example: true
                  roles:
                    type: array
                    example:
                      -
                        id: 1
                        name: admin
                        status: Ativo
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: admin
                        status:
                          type: string
                          example: Ativo
      tags:
        - Autenticação
  /api/users:
    get:
      summary: 'Listar usuários'
      operationId: listarUsurios
      description: 'Retorna lista paginada de usuários com cargo e papéis.'
      parameters:
        -
          in: query
          name: 'filter[name]'
          description: 'Filtro de pesquisa parcial pelo nome.'
          example: Hugo
          required: false
          schema:
            type: string
            description: 'Filtro de pesquisa parcial pelo nome.'
            example: Hugo
        -
          in: query
          name: 'filter[email]'
          description: 'Filtro de pesquisa parcial pelo email.'
          example: hugo@
          required: false
          schema:
            type: string
            description: 'Filtro de pesquisa parcial pelo email.'
            example: hugo@
        -
          in: query
          name: 'filter[position_id]'
          description: 'Filtro exato pelo cargo.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filtro exato pelo cargo.'
            example: 1
        -
          in: query
          name: 'filter[is_active]'
          description: 'Filtra por status ativo/inativo.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Filtra por status ativo/inativo.'
            example: true
        -
          in: query
          name: 'filter[roles]'
          description: 'Filtro exato pelo nome do papel (role).'
          example: admin
          required: false
          schema:
            type: string
            description: 'Filtro exato pelo nome do papel (role).'
            example: admin
        -
          in: query
          name: sort
          description: 'Campo de ordenação. Use "-" para decrescente. Valores permitidos: name, email, created_at, last_login.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Campo de ordenação. Use "-" para decrescente. Valores permitidos: name, email, created_at, last_login.'
            example: '-created_at'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  current_page: 1
                  data:
                    -
                      id: 1
                      name: 'Hugo Barbosa'
                      email: hugo@example.com
                      is_active: true
                      is_dev: false
                      position:
                        id: 1
                        name: Diretor
                      roles:
                        -
                          id: 1
                          name: admin
                  per_page: 20
                  total: 1
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Hugo Barbosa'
                        email: hugo@example.com
                        is_active: true
                        is_dev: false
                        position:
                          id: 1
                          name: Diretor
                        roles:
                          -
                            id: 1
                            name: admin
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Hugo Barbosa'
                        email:
                          type: string
                          example: hugo@example.com
                        is_active:
                          type: boolean
                          example: true
                        is_dev:
                          type: boolean
                          example: false
                        position:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: Diretor
                        roles:
                          type: array
                          example:
                            -
                              id: 1
                              name: admin
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: admin
                  per_page:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 1
      tags:
        - Usuários
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: ''
                  example: null
                  properties:
                    name:
                      type: string
                      description: ''
                      example: architecto
                    email:
                      type: string
                      description: ''
                      example: gbailey@example.net
                    position_id:
                      type: integer
                      description: 'The <code>id</code> of an existing record in the positions table.'
                      example: 16
                    is_active:
                      type: boolean
                      description: ''
                      example: true
                    roles:
                      type: string
                      description: 'The <code>name</code> of an existing record in the roles table.'
                      example: architecto
                sort:
                  type: string
                  description: ''
                  example: '-created_at'
                  enum:
                    - name
                    - '-name'
                    - email
                    - '-email'
                    - created_at
                    - '-created_at'
                    - last_login
                    - '-last_login'
    post:
      summary: 'Criar usuário'
      operationId: criarUsurio
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 2
                  name: 'Maria Silva'
                  email: maria@example.com
                  is_active: true
                  position: null
                  roles: []
                properties:
                  id:
                    type: integer
                    example: 2
                  name:
                    type: string
                    example: 'Maria Silva'
                  email:
                    type: string
                    example: maria@example.com
                  is_active:
                    type: boolean
                    example: true
                  position:
                    type: string
                    example: null
                    nullable: true
                  roles:
                    type: array
                    example: []
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Usuários
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '-0pBNvYgxw'
                cpf:
                  type: string
                  description: 'Must match the regex /^\d{3}\.\d{3}\.\d{3}-\d{2}$|^\d{11}$/.'
                  example: 559.314.232-68$|^22820492192
                  nullable: true
                position_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the positions table.'
                  example: 16
                  nullable: true
                role:
                  type: string
                  description: 'The <code>name</code> of an existing record in the roles table.'
                  example: architecto
                  nullable: true
              required:
                - name
                - email
                - password
  '/api/users/{id}':
    get:
      summary: 'Exibir usuário'
      operationId: exibirUsurio
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Hugo Barbosa'
                  email: hugo@example.com
                  is_active: true
                  is_dev: false
                  position:
                    id: 1
                    name: Diretor
                  roles:
                    -
                      id: 1
                      name: admin
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Hugo Barbosa'
                  email:
                    type: string
                    example: hugo@example.com
                  is_active:
                    type: boolean
                    example: true
                  is_dev:
                    type: boolean
                    example: false
                  position:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Diretor
                  roles:
                    type: array
                    example:
                      -
                        id: 1
                        name: admin
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: admin
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\User]'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\User]'
      tags:
        - Usuários
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: ''
                  example: null
                  properties:
                    name:
                      type: string
                      description: ''
                      example: architecto
                    email:
                      type: string
                      description: ''
                      example: gbailey@example.net
                    position_id:
                      type: integer
                      description: 'The <code>id</code> of an existing record in the positions table.'
                      example: 16
                    is_active:
                      type: boolean
                      description: ''
                      example: false
                    roles:
                      type: string
                      description: 'The <code>name</code> of an existing record in the roles table.'
                      example: architecto
                sort:
                  type: string
                  description: ''
                  example: '-created_at'
                  enum:
                    - name
                    - '-name'
                    - email
                    - '-email'
                    - created_at
                    - '-created_at'
                    - last_login
                    - '-last_login'
    put:
      summary: 'Atualizar usuário'
      operationId: atualizarUsurio
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Hugo Barbosa Atualizado'
                  email: hugo@example.com
                  is_active: true
                  position:
                    id: 1
                    name: Diretor
                  roles:
                    -
                      id: 1
                      name: admin
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Hugo Barbosa Atualizado'
                  email:
                    type: string
                    example: hugo@example.com
                  is_active:
                    type: boolean
                    example: true
                  position:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Diretor
                  roles:
                    type: array
                    example:
                      -
                        id: 1
                        name: admin
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: admin
      tags:
        - Usuários
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '-0pBNvYgxw'
                cpf:
                  type: string
                  description: 'Must match the regex /^\d{3}\.\d{3}\.\d{3}-\d{2}$|^\d{11}$/.'
                  example: 559.314.232-68$|^22820492192
                  nullable: true
                position_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the positions table.'
                  example: 16
                  nullable: true
                role:
                  type: string
                  description: 'The <code>name</code> of an existing record in the roles table.'
                  example: architecto
                  nullable: true
    delete:
      summary: 'Inativar / Reativar usuário'
      operationId: inativarReativarUsurio
      description: "Quando `activate=false` (padrão), inativa o usuário e revoga todos os seus tokens.\nQuando `activate=true`, reativa o usuário.\nUsuários marcados como `is_dev` não podem ser inativados."
      parameters:
        -
          in: query
          name: activate
          description: 'Passa `true` para reativar, `false` (padrão) para inativar.'
          example: false
          required: false
          schema:
            type: boolean
            description: 'Passa `true` para reativar, `false` (padrão) para inativar.'
            example: false
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Hugo Barbosa'
                  is_active: false
                  position:
                    id: 1
                    name: Diretor
                  roles: []
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Hugo Barbosa'
                  is_active:
                    type: boolean
                    example: false
                  position:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Diretor
                  roles:
                    type: array
                    example: []
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\User]'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\User]'
      tags:
        - Usuários
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activate:
                  type: boolean
                  description: ''
                  example: false
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the user.'
        example: 1
        required: true
        schema:
          type: integer
  /api/positions:
    get:
      summary: 'Listar cargos'
      operationId: listarCargos
      description: 'Retorna lista paginada de cargos.'
      parameters:
        -
          in: query
          name: 'filter[name]'
          description: 'Filtro de pesquisa parcial pelo nome.'
          example: Diretor
          required: false
          schema:
            type: string
            description: 'Filtro de pesquisa parcial pelo nome.'
            example: Diretor
        -
          in: query
          name: 'filter[is_active]'
          description: 'Filtra por status ativo/inativo.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Filtra por status ativo/inativo.'
            example: true
        -
          in: query
          name: sort
          description: 'Campo de ordenação. Use "-" para decrescente. Valores permitidos: name, created_at.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Campo de ordenação. Use "-" para decrescente. Valores permitidos: name, created_at.'
            example: '-created_at'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  current_page: 1
                  data:
                    -
                      id: 1
                      name: Diretor
                      is_active: true
                  per_page: 20
                  total: 1
                properties:
                  current_page:
                    type: integer
                    example: 1
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: Diretor
                        is_active: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Diretor
                        is_active:
                          type: boolean
                          example: true
                  per_page:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 1
      tags:
        - Cargos
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: ''
                  example: null
                  properties:
                    name:
                      type: string
                      description: ''
                      example: architecto
                    is_active:
                      type: boolean
                      description: ''
                      example: true
                sort:
                  type: string
                  description: ''
                  example: created_at
                  enum:
                    - name
                    - '-name'
                    - created_at
                    - '-created_at'
    post:
      summary: 'Criar cargo'
      operationId: criarCargo
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 2
                  name: Secretário
                  is_active: true
                properties:
                  id:
                    type: integer
                    example: 2
                  name:
                    type: string
                    example: Secretário
                  is_active:
                    type: boolean
                    example: true
      tags:
        - Cargos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 191 characters.'
                  example: b
                description:
                  type: string
                  description: 'Must not be greater than 191 characters.'
                  example: 'Et animi quos velit et fugiat.'
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: true
              required:
                - name
  '/api/positions/{id}':
    get:
      summary: 'Exibir cargo'
      operationId: exibirCargo
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: Diretor
                  is_active: true
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Diretor
                  is_active:
                    type: boolean
                    example: true
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\Position]'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\Position]'
      tags:
        - Cargos
    put:
      summary: 'Atualizar cargo'
      operationId: atualizarCargo
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Diretor Geral'
                  is_active: true
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Diretor Geral'
                  is_active:
                    type: boolean
                    example: true
      tags:
        - Cargos
      requestBody:
        required: false
        content:
          application/json:
