  /api/backups/manual:
    post:
      summary: 'Backup manual'
      operationId: backupManual
      description: "Gera um backup manual do banco de dados. O parâmetro `storage` define o destino:\n- `r2`: armazena no Cloudflare R2 e registra como disponível para download posterior.\n- `download`: retorna o arquivo ZIP diretamente como download. Registrado como indisponível (sem cópia armazenada).\n\nRequer permissão `configuracoes.acessar` ou usuário marcado como `is_dev`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Armazenado na R2'
                    type: object
                    example:
                      success: true
                      message: 'Backup manual salvo na R2 com sucesso'
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: 'Backup manual salvo na R2 com sucesso'
                  -
                    description: Download
                    type: object
                    example:
                      description: 'Arquivo ZIP retornado como download binário'
                    properties:
                      description:
                        type: string
                        example: 'Arquivo ZIP retornado como download binário'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The storage field is required.'
                  errors:
                    storage:
                      - 'The storage field is required.'
                properties:
                  message:
                    type: string
                    example: 'The storage field is required.'
                  errors:
                    type: object
                    properties:
                      storage:
                        type: array
                        example:
                          - 'The storage field is required.'
                        items:
                          type: string
      tags:
        - Backups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storage:
                  type: string
                  description: 'Destino do backup: `r2` para armazenar na nuvem, `download` para baixar imediatamente.'
                  example: r2
              required:
                - storage
